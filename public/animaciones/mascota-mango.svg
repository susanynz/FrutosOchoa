<?xml version="1.0" encoding="UTF-8"?>
<!-- Animación "Mango, mascota de la tiendita" - Frutos Ochoa
     Personaje vectorial organizado en capas de Inkscape y animado con @keyframes CSS. -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     viewBox="0 0 220 220" width="220" height="220" role="img"
     aria-labelledby="titulo-mascota">
  <title id="titulo-mascota">Mango, la mascota de Frutos Ochoa, saludando</title>
  <sodipodi:namedview id="vista" pagecolor="#ffffff" inkscape:document-units="px"/>
  <style>
    .cuerpo { animation: brinco 1.6s ease-in-out infinite; }
    .sombra { transform-origin: 110px 204px; animation: sombra 1.6s ease-in-out infinite; }
    .hoja { transform-origin: 112px 46px; animation: mecer 1.6s ease-in-out infinite alternate; }
    .brazo { transform-origin: 160px 112px; animation: saludar .5s ease-in-out infinite alternate; }
    .ojos { transform-box: fill-box; transform-origin: center; animation: parpadear 4s infinite; }
    .brillo { animation: brillar 2s ease-in-out infinite; }
    @keyframes brinco { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes sombra { 0%, 100% { transform: scale(1); opacity: .25; } 50% { transform: scale(.75); opacity: .12; } }
    @keyframes mecer { from { transform: rotate(-10deg); } to { transform: rotate(12deg); } }
    @keyframes saludar { from { transform: rotate(-18deg); } to { transform: rotate(22deg); } }
    @keyframes parpadear { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes brillar { 0%, 100% { opacity: .9; } 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g id="capa-sombra" inkscape:groupmode="layer" inkscape:label="Sombra">
    <ellipse class="sombra" cx="110" cy="204" rx="54" ry="9" fill="#333333"/>
  </g>

  <g id="capa-personaje" inkscape:groupmode="layer" inkscape:label="Personaje">
    <g class="cuerpo">
      <path class="hoja" d="M112 50 C118 26 142 18 162 24 C150 42 132 52 112 50Z" fill="#2A9D8F" stroke="#21867a" stroke-width="3"/>
      <path d="M108 54 L110 40" stroke="#6B4226" stroke-width="5" stroke-linecap="round"/>
      <!-- Cuerpo de mango -->
      <path d="M110 52 C160 50 178 100 170 140 C162 182 128 196 100 192 C64 188 44 160 48 124 C52 84 72 54 110 52Z" fill="#FFB703" stroke="#FB8500" stroke-width="4"/>
      <path class="brillo" d="M58 120 C60 92 76 72 98 64" stroke="#FFE08A" stroke-width="7" fill="none" stroke-linecap="round"/>
      <!-- Brazo que saluda -->
      <g class="brazo">
        <path d="M160 112 C176 104 184 92 186 80" stroke="#FB8500" stroke-width="7" fill="none" stroke-linecap="round"/>
        <circle cx="187" cy="76" r="8" fill="#FFB703" stroke="#FB8500" stroke-width="3"/>
      </g>
      <path d="M54 138 C42 144 38 152 40 160" stroke="#FB8500" stroke-width="7" fill="none" stroke-linecap="round"/>
      <!-- Cara -->
      <g class="ojos" fill="#2B2D42">
        <ellipse cx="94" cy="112" rx="7" ry="9"/><ellipse cx="128" cy="112" rx="7" ry="9"/>
      </g>
      <circle cx="96" cy="109" r="2.4" fill="#FFFFFF"/><circle cx="130" cy="109" r="2.4" fill="#FFFFFF"/>
      <ellipse cx="80" cy="130" rx="9" ry="5" fill="#E76F51" opacity=".55"/>
      <ellipse cx="142" cy="130" rx="9" ry="5" fill="#E76F51" opacity=".55"/>
      <path d="M98 132 Q111 146 124 132" stroke="#2B2D42" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
